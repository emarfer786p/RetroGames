spring.application.name=retrogames
server.port=8080

# Conexion parametrizada mediante variables de entorno de Docker
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:retrogames_db}
spring.datasource.username=${POSTGRES_USER:arcade_user}
spring.datasource.password=${POSTGRES_PASSWORD:arcade_secret_pass}

# Crea/actualiza la tabla automaticamente al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
