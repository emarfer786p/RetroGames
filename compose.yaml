services:
  db:
    image: postgres:16-alpine
    container_name: retrogames-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: retrogames-spring-api
    restart: unless-stopped
    ports:
      - "8086:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

volumes:
  postgres_data:

networks:
  backend-net:
    driver: bridge
