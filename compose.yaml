services:
  db:
    image: postgres:16-alpine
    container_name: retrogames-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net

  api:
    build: .
    container_name: retrogames-spring-api
    restart: unless-stopped
    ports:
      - "8086:8080"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - backend-net

volumes:
  postgres_data:

networks:
  backend-net:
    driver: bridge
